name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag to release (e.g. v5.0.2)'
        required: true
        default: 'v5.0.2'

permissions:
  contents: write

jobs:
  publish-windows-release:
    name: Build & Publish Windows Portable Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-sdl3

      - name: Configure & Compile FluxMirror Native Engine
        shell: msys2 {0}
        run: |
          meson setup build-win64 -Dcompile_server=false -Dprebuilt_server=scrcpy-server -Dportable=true --buildtype=release
          ninja -C build-win64
          mkdir -p bin
          cp build-win64/app/scrcpy.exe bin/FluxMirror.exe
          cp build-win64/app/scrcpy.exe bin/scrcpy.exe

      - name: Build Standalone Distribution Package
        shell: pwsh
        run: |
          .\scripts\package-release.ps1

      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FluxMirror-Windows-x64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
